org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Keep the Kotlin daemon well below the Gradle heap so both can coexist on
# 8-16 GB machines (the previous 8G+4G request starved it and it crashed).
kotlin.daemon.jvmargs=-Xmx2G
# Kotlin incremental compilation cannot build relative paths across Windows
# drive letters (Pub cache on C:, project on D:) and kills the compiler
# daemon with "this and base files have different roots". Full recompile
# per module is the reliable trade-off.
kotlin.incremental=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
